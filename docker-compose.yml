services:
  postgres:
    image: postgres:16-alpine
    container_name: leomadzhbot-postgres
    environment:
      POSTGRES_DB: leomadzhbot
      POSTGRES_USER: leomadzhbot
      POSTGRES_PASSWORD: leomadzhbot
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leomadzhbot -d leomadzhbot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: leomadzhbot-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: leomadzhbot-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  profile-service:
    build:
      context: ./services/profile_service
    container_name: leomadzhbot-profile-service
    environment:
      DATABASE_URL: postgresql+asyncpg://leomadzhbot:leomadzhbot@postgres:5432/leomadzhbot
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: photos
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  bot-gateway:
    build:
      context: ./services/bot_gateway
    container_name: leomadzhbot-bot-gateway
    environment:
      PROFILE_SERVICE_BASE_URL: http://profile-service:8000
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: photos
    depends_on:
      - profile-service
      - minio

volumes:
  pgdata:
  redisdata:
  miniodata:
